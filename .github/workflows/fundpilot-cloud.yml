name: FundPilot cloud verification

on:
  push:
    branches:
      - 'fundpilot/opensource-adaptation-20261024'
    paths:
      - 'FundPilot/**'
      - 'ResearchHotspotFollow/**'
      - 'TextReadable/**'
      - 'shared/**'
      - '.github/workflows/fundpilot-cloud.yml'
  pull_request:
    paths:
      - 'FundPilot/**'
      - 'ResearchHotspotFollow/**'
      - 'TextReadable/**'
      - 'shared/**'
      - '.github/workflows/fundpilot-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundpilot-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Foundation regression (synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Record actual cloud execution context
        run: |
          uname -s
          python --version
          git rev-parse HEAD
      - name: FundPilot regression
        env:
          PYTHONPATH: FundPilot
        run: python -m unittest discover -s FundPilot/tests -q
      - name: ResearchHotspotFollow regression
        run: python -m unittest discover -s ResearchHotspotFollow/tests -q
      - name: TextReadable regression
        run: python -m unittest discover -s TextReadable/tests -q
      - name: Compile and release checks
        run: |
          python -m compileall -q FundPilot/fundpilot
          python FundPilot/scripts/check_release.py
          git diff --check
      - name: State verification boundary
        run: |
          printf '%s\n' 'Only synthetic engineering regression. No real LLM call, private records, fund performance, deployment or investment qualification is asserted.' >> "$GITHUB_STEP_SUMMARY"

  upstream:
    name: Pinned TradingAgents install and offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch the reviewed upstream commit
        env:
          UPSTREAM_SHA: e8f5503e9b86d5c2710b0c76b1f686703968c9df
        run: |
          git init "$RUNNER_TEMP/tradingagents"
          git -C "$RUNNER_TEMP/tradingagents" remote add origin https://github.com/TauricResearch/TradingAgents.git
          git -C "$RUNNER_TEMP/tradingagents" fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/tradingagents" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tradingagents" rev-parse HEAD)" = "$UPSTREAM_SHA"
          sha256sum "$RUNNER_TEMP/tradingagents/LICENSE"
      - name: Isolated dependency installation
        run: |
          python -m venv "$RUNNER_TEMP/tradingagents-venv"
          "$RUNNER_TEMP/tradingagents-venv/bin/python" -m pip install --no-input --disable-pip-version-check --timeout 30 --retries 0 -c "$GITHUB_WORKSPACE/FundPilot/requirements/tradingagents-linux-py312.constraints.txt" "$RUNNER_TEMP/tradingagents[dev]"
          "$RUNNER_TEMP/tradingagents-venv/bin/python" -m pip check
          "$RUNNER_TEMP/tradingagents-venv/bin/python" -m pip freeze
      - name: Upstream auth and checkpoint regression (no live account)
        run: |
          cd "$RUNNER_TEMP/tradingagents"
          "$RUNNER_TEMP/tradingagents-venv/bin/python" -m pytest tests/test_chatgpt_auth.py tests/test_chatgpt_provider.py tests/test_checkpoint_resume.py tests/test_checkpoint_lifecycle.py -q
      - name: State upstream verification boundary
        run: |
          printf '%s\n' 'Pinned upstream package execution and offline tests only. No subscription login, paid API, live model or investment result is claimed.' >> "$GITHUB_STEP_SUMMARY"
